name: Build Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows Win32
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild eob3/eob3.vcxproj  /m /p:Configuration=Release /p:Platform=Win32

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path eob3/Release/eob3.exe -DestinationPath eob3-win32.zip
        
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view latest-build --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload latest-build eob3-win32.zip \
              --clobber \
              --repo "$GH_REPO"
          else
            gh release create latest-build eob3-win32.zip \
              --title "Latest Build" \
              --notes "Latest Windows x86 build." \
              --repo "$GH_REPO"
