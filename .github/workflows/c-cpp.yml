name: Build Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows Win32
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A Win32

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build/Release/eob3.exe -DestinationPath eob3-win32.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: eob3-win32
          path: eob3-win32.zip

  ubuntu:
    name: Ubuntu x64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Package
        run: tar -czf eob3-linux-x64.tar.gz -C build eob3

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: eob3-linux-x64
          path: eob3-linux-x64.tar.gz

  release:
    name: Publish latest release
    needs: [windows, ubuntu]
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: eob3-win32
          path: release

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: eob3-linux-x64
          path: release

      - name: Update latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view latest-build --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload latest-build release/eob3-win32.zip release/eob3-linux-x64.tar.gz --clobber --repo "$GH_REPO"
          else
            gh release create latest-build release/eob3-win32.zip release/eob3-linux-x64.tar.gz --title "Latest Build" --notes "Latest successful Windows Win32 and Linux x64 builds." --repo "$GH_REPO"
          fi
